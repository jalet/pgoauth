---
name: "src - Docker"

on:
  push:
    branches: ["main"]
    tags: ["v*.*.*"]
    paths:
      - src/**
      - .github/workflows/src-dkr.yaml
  pull_request:
    branches: ["main"]
    paths:
      - src/**
      - .github/workflows/src-dkr.yaml

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: jalet/postgresql
  WORKING_DIR: src
  # Add or remove PostgreSQL minor versions here.
  PG_VERSIONS: '["18.1","18.2","18.3"]'

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      platforms:   ${{ steps.platforms.outputs.platforms }}
      pg_versions: ${{ env.PG_VERSIONS }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create platform matrix
        id: platforms
        run: |
          echo "platforms=$(docker buildx bake \
            -f docker-bake.hcl \
            -f ${{ env.WORKING_DIR }}/docker-bake.hcl \
            ${{ env.WORKING_DIR }}-all --print | \
            jq -cr '.target."${{ env.WORKING_DIR }}-all".platforms')" \
          >> ${GITHUB_OUTPUT}

      - name: Show matrix
        run: |
          echo "platforms: ${{ steps.platforms.outputs.platforms }}"
          echo "pg_versions: ${{ env.PG_VERSIONS }}"

      - name: Docker meta
        id: meta_std
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix={{branch}}-,format=long

      - name: Rename meta bake definition file
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        run: |
          mv "${{ steps.meta_std.outputs.bake-file }}" "${{ runner.temp }}/bake-meta.json"

      - name: Docker meta
        id: meta_tag
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Rename meta bake definition file
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        run: |
          mv "${{ steps.meta_tag.outputs.bake-file }}" "${{ runner.temp }}/bake-meta.json"

      - name: Upload meta bake definition
        uses: actions/upload-artifact@v4
        with:
          name: bake-meta
          path: ${{ runner.temp }}/bake-meta.json
          if-no-files-found: error
          retention-days: 1

  build:
    runs-on: ${{ startsWith(matrix.platform, 'linux/arm') && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    needs:
      - prepare

    strategy:
      fail-fast: false
      matrix:
        platform:   ${{ fromJson(needs.prepare.outputs.platforms) }}
        pg_version: ${{ fromJson(needs.prepare.outputs.pg_versions) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare
        run: |
          platform=${{ matrix.platform }}
          echo "PLATFORM_PAIR=${platform//\//-}" >> $GITHUB_ENV

      - name: Download meta bake definition
        uses: actions/download-artifact@v4
        with:
          name: bake-meta
          path: ${{ runner.temp }}

      - name: Log into registry ${{ env.REGISTRY }}
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build
        id: bake
        uses: docker/bake-action@v6
        with:
          targets: ${{ env.WORKING_DIR }}
          files: |
            cwd://docker-bake.hcl
            cwd://${{ env.WORKING_DIR }}/docker-bake.hcl
            cwd://${{ runner.temp }}/bake-meta.json
          set: |
            *.tags=ghcr.io/${{ env.IMAGE_NAME }}
            *.platform=${{ matrix.platform }}
            *.args.PG_VERSION=${{ matrix.pg_version }}
            *.output=type=image,push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        run: |
          mkdir -p ${{ runner.temp }}/digests
          digest="${{ fromJSON(steps.bake.outputs.metadata)[env.WORKING_DIR]['containerimage.digest'] }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      # Artifact name encodes the pg_version so the merge job can filter by it.
      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.pg_version }}-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    needs:
      - prepare
      - build

    # One manifest list per PostgreSQL version.
    strategy:
      fail-fast: false
      matrix:
        pg_version: ${{ fromJson(needs.prepare.outputs.pg_versions) }}

    steps:
      - name: Download meta bake definition
        uses: actions/download-artifact@v4
        with:
          name: bake-meta
          path: ${{ runner.temp }}

      # Only download digests that belong to this pg_version.
      - name: Download digests for ${{ matrix.pg_version }}
        uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-${{ matrix.pg_version }}-*
          merge-multiple: true

      - name: Log into registry ${{ env.REGISTRY }}
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Tags produced per version:
      #   <pg_version>                    e.g. 18.1
      #   <pg_version>-<branch>           e.g. 18.1-main
      #   <pg_version>-<branch>-<sha>     e.g. 18.1-main-abc1234  (branch builds)
      #   <pg_version>-<semver>           e.g. 18.1-1.2.3         (tag builds)
      - name: Create manifest list and push
        working-directory: ${{ runner.temp }}/digests
        run: |
          PGV="${{ matrix.pg_version }}"
          # Build a -t argument for every tag from the bake-meta, prefixing the
          # image tag value with the pg_version so tags are version-scoped.
          VERSION_TAGS=$(jq -cr --arg pgv "$PGV" \
            '.target."docker-metadata-action".tags
             | map("-t " + (gsub("(?<img>[^:]+):(?<tag>.+)"; "\(.img):\($pgv)-\(.tag)")))
             | join(" ")' \
            ${{ runner.temp }}/bake-meta.json)

          docker buildx imagetools create \
            -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${PGV} \
            ${VERSION_TAGS} \
            $(printf '${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@sha256:%s ' *)

      - name: Inspect image
        run: |
          docker buildx imagetools inspect \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ matrix.pg_version }}
