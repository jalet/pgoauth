# Example CloudNativePG 1.29 cluster that loads pg_oauth as an extension image
# volume (NO custom operand image).
#
# How it works:
#   - spec.postgresql.extensions mounts ghcr.io/jalet/pg-oauth into each pod as a
#     Kubernetes ImageVolume at /extensions/pg_oauth, and CNPG sets
#     dynamic_library_path to include /extensions/pg_oauth/lib.
#   - oauth_validator_libraries='pg_oauth' is then resolved along
#     dynamic_library_path (load_external_function -> expand_dynamic_library_name),
#     so /extensions/pg_oauth/lib/pg_oauth.so is loaded. No CREATE EXTENSION.
#
# Prerequisites:
#   - PostgreSQL 18+ (extension_control_path / image-volume extensions).
#   - Kubernetes >= 1.35 (ImageVolume on by default) or 1.33-1.34 with the
#     ImageVolume feature gate enabled on kube-apiserver and kubelet.
#   - Container runtime: containerd >= v2.1.0 or CRI-O >= v1.31.
#   - The ghcr.io/jalet/pg-oauth package must be public, or add an
#     imagePullSecret (see spec.imagePullSecrets / the extension image pull auth).
---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: pg-oauth
  namespace: databases
spec:
  instances: 3
  # Stock CNPG operand image -- unchanged, no extension baked in.
  imageName: ghcr.io/cloudnative-pg/postgresql:18-standard-trixie

  postgresql:
    extensions:
      - name: pg_oauth
        image:
          # The extension image built by this repo (contains /lib/pg_oauth.so).
          # Pin to a digest or release tag in production.
          reference: ghcr.io/jalet/pg-oauth:latest

    parameters:
      # Loaded at postmaster start; resolved via the dynamic_library_path CNPG
      # set from the mounted volume. (Verify CNPG 1.29 does not treat this as a
      # fixed/blocked parameter for your version; if it does, use the operator's
      # supported escape hatch.)
      oauth_validator_libraries: "pg_oauth"
      # pg_oauth module configuration (read as GUCs):
      pg_oauth.jwks_uri:    "https://idp.example/realms/main/protocol/openid-connect/certs"
      pg_oauth.issuer:      "https://idp.example/realms/main"
      pg_oauth.audience:    "postgres"
      pg_oauth.scope_claim: "scope"
      # Option C: the requested Postgres role must appear in this token claim,
      # so Keycloak controls which roles a subject may assume.
      pg_oauth.roles_claim: "realm_access.roles"

    pg_hba:
      # delegate_ident_mapping=1 hands role authorization to pg_oauth, which
      # checks the requested role against realm_access.roles.
      - >-
        hostssl all all 0.0.0.0/0 oauth
        issuer="https://idp.example/realms/main"
        scope="openid"
        validator=pg_oauth
        delegate_ident_mapping=1

  # OAuth authenticates a token; the target login role must already exist and is
  # GRANTed its privileges here. Keycloak decides WHICH role; Postgres decides
  # WHAT that role can do.
  managed:
    roles:
      - name: app_reader
        ensure: present
        login: true
        comment: "OAuth/Keycloak-mapped read role"
      - name: app_writer
        ensure: present
        login: true
        comment: "OAuth/Keycloak-mapped write role"

  storage:
    size: 10Gi
