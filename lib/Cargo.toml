[package]
name        = "pg_oauth"
version     = "0.1.0"
edition     = "2021"
description = "PostgreSQL 18 OAuth bearer-token validator – pure Rust implementation"
license     = "MIT"

[lib]
crate-type = ["cdylib"]

[features]
default = ["pg18"]
pg18    = ["pgrx/pg18"]

[dependencies]
pgrx         = { version = "=0.17.0", default-features = false }
jsonwebtoken = { version = "9", default-features = false, features = ["use_pem"] }
serde        = { version = "1", features = ["derive"] }
serde_json   = "1"
ureq         = { version = "2", default-features = false, features = ["tls"] }

[dev-dependencies]
# httpmock: local mock HTTP server for JWKS endpoint tests
httpmock     = "0.7"
base64       = "0.22"

[profile.release]
opt-level = 3
lto       = "thin"
panic     = "abort"
strip     = "symbols"

[profile.test]
# keep debug info in test builds; do NOT set panic=abort (tests use unwinding)
opt-level = 0
