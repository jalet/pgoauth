listen_addresses = '*'
hba_file = '/etc/postgresql/pg_hba.conf'

# Mirror the CloudNativePG image-volume wiring: the validator .so lives in the
# mounted extension dir, not $libdir. CNPG sets dynamic_library_path to
# /extensions/<name>/lib automatically; we set it explicitly for the local test.
# oauth_validator_libraries resolves the unqualified name 'pg_oauth' along this
# path (load_external_function -> expand_dynamic_library_name).
dynamic_library_path = '$libdir:/extensions/pg_oauth/lib'
oauth_validator_libraries = 'pg_oauth'

pg_oauth.jwks_uri    = 'http://jwks/jwks.json'
pg_oauth.issuer      = 'http://oauth-server'
pg_oauth.audience    = 'postgresql'
pg_oauth.scope_claim = 'scope'
# Option C: the requested Postgres role must appear in this token claim.
pg_oauth.roles_claim = 'realm_access.roles'
