listen_addresses = '*'
hba_file = '/etc/postgresql/pg_hba.conf'
oauth_validator_libraries = 'pg_oauth'

pg_oauth.jwks_uri    = 'http://jwks/jwks.json'
pg_oauth.issuer      = 'http://oauth-server'
pg_oauth.audience    = 'postgresql'
pg_oauth.scope_claim = 'scope'
# Option C: the requested Postgres role must appear in this token claim.
pg_oauth.roles_claim = 'realm_access.roles'
