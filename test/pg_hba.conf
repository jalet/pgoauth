# local connections (superuser setup, health checks)
local   all  all                   trust
host    all  all  127.0.0.1/32     trust

# OAuth — any remote host must present a valid bearer token.
# delegate_ident_mapping=1: pg_oauth (not pg_ident) decides which role the
# token may assume, by checking the requested role against the token's
# realm_access.roles claim (see pg_oauth.roles_claim in postgresql.conf).
host    all  all  0.0.0.0/0  oauth issuer="http://oauth-server" scope="db:read" delegate_ident_mapping=1
